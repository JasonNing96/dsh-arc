<text x="30" y="40" font-size="24" font-weight="650" text-anchor="start">03  插件组装｜界面、执行驱动与 runtime 分层</text>
<text x="30" y="69" font-size="15" font-weight="400" text-anchor="start" style="fill:#617088">v1.0 已验收 · 配套 TUI 0.10.1-arc.1.0.0 提供执行接口扩展；不代表上游已经接受。</text>
