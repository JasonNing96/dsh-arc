<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090" role="img" aria-labelledby="02-handoff-sequence-title">
<title id="02-handoff-sequence-title">02  投切时序｜准备目标后，再提交可见执行端</title>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1b2b45} .small{fill:#617088}</style>
<rect width="1280" height="100%" fill="#fff"/>
<defs>
<marker id="02-handoff-sequence-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315bd6"/></marker>
<marker id="02-handoff-sequence-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/></marker>
<marker id="02-handoff-sequence-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66758d"/></marker>
<marker id="02-handoff-sequence-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c55bb"/></marker>
</defs>
<text x="30" y="40" font-size="24" font-weight="650" text-anchor="start">02  投切时序｜准备目标后，再提交可见执行端</text>
<text x="30" y="69" font-size="15" font-weight="400" text-anchor="start" style="fill:#617088">实现路径 · 同一逻辑会话与 Home 保留；目标使用新的原生 session</text>
<rect x="25" y="100" width="180" height="58" rx="10" fill="#ffffff" stroke="#ccd5e3" stroke-width="1.4"/>
<text x="115.0" y="135.0" font-size="18" font-weight="600" text-anchor="middle">TUI / 用户</text>
<path d="M 115 158 L 115 983" stroke="#cbd5e4" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="275" y="100" width="180" height="58" rx="10" fill="#eef3ff" stroke="#9eb6f1" stroke-width="1.4"/>
<text x="365.0" y="135.0" font-size="18" font-weight="600" text-anchor="middle">ARC 控制器</text>
<path d="M 365 158 L 365 983" stroke="#cbd5e4" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="525" y="100" width="180" height="58" rx="10" fill="#ffffff" stroke="#ccd5e3" stroke-width="1.4"/>
<text x="615.0" y="135.0" font-size="18" font-weight="600" text-anchor="middle">源 runtime</text>
<path d="M 615 158 L 615 983" stroke="#cbd5e4" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="775" y="100" width="180" height="58" rx="10" fill="#ffffff" stroke="#ccd5e3" stroke-width="1.4"/>
<text x="865.0" y="135.0" font-size="18" font-weight="600" text-anchor="middle">目标 runtime</text>
<path d="M 865 158 L 865 983" stroke="#cbd5e4" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="1045" y="100" width="180" height="58" rx="10" fill="#ffffff" stroke="#ccd5e3" stroke-width="1.4"/>
<text x="1135.0" y="135.0" font-size="18" font-weight="600" text-anchor="middle">本地索引</text>
<path d="M 1135 158 L 1135 983" stroke="#cbd5e4" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M 115 208 L 365 208" fill="none" stroke="#315bd6" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-blue)"/>
<rect x="204.0" y="183" width="72.0" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="240.0" y="196" font-size="14" font-weight="400" text-anchor="middle" style="fill:#315bd6">请求投切</text>
<rect x="235" y="237" width="460" height="55" rx="10" fill="#f4f6fa" stroke="#d9e0ea" stroke-width="1.4"/>
<text x="465.0" y="270.5" font-size="18" font-weight="600" text-anchor="middle">检查：空闲、无待决权限；保留源端与草稿</text>
<path d="M 365 340 L 865 340" fill="none" stroke="#315bd6" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-blue)"/>
<rect x="530.0" y="315" width="170.0" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="615.0" y="328" font-size="14" font-weight="400" text-anchor="middle" style="fill:#315bd6">连接、初始化与能力检查</text>
<path d="M 365 408 L 615 408" fill="none" stroke="#315bd6" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-blue)"/>
<rect x="419.0" y="383" width="142.0" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="490.0" y="396" font-size="14" font-weight="400" text-anchor="middle" style="fill:#315bd6">请求当前会话检查点</text>
<path d="M 615 476 L 365 476" fill="none" stroke="#087f83" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-teal)"/>
<rect x="419.0" y="451" width="142.0" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="490.0" y="464" font-size="14" font-weight="400" text-anchor="middle" style="fill:#087f83">持久化屏障后的消息</text>
<path d="M 365 544 L 865 544" fill="none" stroke="#087f83" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-teal)"/>
<rect x="491.6" y="519" width="246.7" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="615.0" y="532" font-size="14" font-weight="400" text-anchor="middle" style="fill:#087f83">暂存检查点并恢复目标原生 session</text>
<path d="M 865 612 L 365 612" fill="none" stroke="#087f83" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-teal)"/>
<rect x="500.9" y="587" width="228.2" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="615.0" y="600" font-size="14" font-weight="400" text-anchor="middle" style="fill:#087f83">返回目标 sessionId 与连接状态</text>
<rect x="235" y="638" width="700" height="55" rx="10" fill="#f4f6fa" stroke="#d9e0ea" stroke-width="1.4"/>
<text x="585.0" y="671.5" font-size="18" font-weight="600" text-anchor="middle">准备阶段：没有发送新 prompt；用户仍在源端</text>
<rect x="220" y="718" width="1020" height="78" rx="12" fill="#eaf8f6" stroke="#8ecdc6"/>
<path d="M 365 765 L 1135 765" fill="none" stroke="#087f83" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-teal)"/>
<rect x="602.0" y="740" width="296.0" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="750.0" y="753" font-size="14" font-weight="400" text-anchor="middle" style="fill:#087f83">保存最终草稿、镜像与活动指针（提交边界）</text>
<path d="M 365 840 L 115 840" fill="none" stroke="#315bd6" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-blue)"/>
<rect x="141.0" y="815" width="198.0" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="240.0" y="828" font-size="14" font-weight="400" text-anchor="middle" style="fill:#315bd6">发布目标端；保留对话与草稿</text>
<path d="M 115 906 L 365 906" fill="none" stroke="#315bd6" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-blue)"/>
<rect x="197.0" y="881" width="86.0" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="240.0" y="894" font-size="14" font-weight="400" text-anchor="middle" style="fill:#315bd6">下一条输入</text>
<path d="M 365 967 L 865 967" fill="none" stroke="#315bd6" stroke-width="2" stroke-linejoin="round" marker-end="url(#02-handoff-sequence-blue)"/>
<rect x="516.6" y="942" width="196.9" height="22" rx="4" fill="#fff" fill-opacity=".98"/>
<text x="615.0" y="955" font-size="14" font-weight="400" text-anchor="middle" style="fill:#315bd6">向已提交的目标发送 prompt</text>
<rect x="30" y="1009" width="595" height="52" rx="10" fill="#f4f6fa" stroke="#d9e0ea" stroke-width="1.4"/>
<text x="327.5" y="1041.0" font-size="18" font-weight="600" text-anchor="middle">提交前失败：保留源端</text>
<rect x="650" y="1009" width="600" height="52" rx="10" fill="#f4f6fa" stroke="#d9e0ea" stroke-width="1.4"/>
<text x="950.0" y="1041.0" font-size="18" font-weight="600" text-anchor="middle">提交后断连：恢复已提交端，不承诺副作用回滚</text>
</svg>