name: Publish Docker image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.5.0'
      - name: Install locked distribution and check configuration lifecycle
        run: |
          npm ci --prefix distribution/dsh-arc-cli --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm test --prefix distribution/dsh-arc-cli
      - name: Prepare the platform-complete release
        run: |
          python3 tools/prepare-arc-native.py
          mkdir -p artifacts
          python3 tools/pack-arc-release.py artifacts
          cp artifacts/jasonning-dsh-arc-1.0.0.tgz distribution/docker/dsh-arc.tgz
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: distribution
          file: distribution/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jasonning96/dsh-arc:1.0.0
            ghcr.io/jasonning96/dsh-arc:latest
